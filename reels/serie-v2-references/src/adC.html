<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>SublimNet – Pourquoi</title>
<link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="fonts/playfair.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden;background:#09090B}
#ad{position:absolute;inset:0;overflow:hidden;background:radial-gradient(80% 90% at 50% 40%,#121216 0%,#0a0a0c 70%,#070708 100%);font-family:Manrope,sans-serif;color:#fff}
:root{--ac:#A66BFF;--acg:rgba(166,107,255,.55)}
.abs{position:absolute}
#cam{position:absolute;left:0;top:0;width:1600px;height:900px;perspective:1800px}
#ui{position:absolute;left:0;top:0;width:1600px;height:1500px;transform-origin:0 0}
.chip{position:absolute;top:58px;height:56px;padding:0 30px;border-radius:999px;background:#1f1f25;color:#d8d8de;font-weight:700;font-size:23px;display:flex;align-items:center;border:1.5px solid #2b2b33}
.chip.on{background:var(--ac);color:#0b0b0e;border-color:var(--ac);box-shadow:0 0 22px var(--acg),0 0 60px rgba(166,107,255,.25)}
.card{position:absolute;border-radius:22px;background:#17171c;border:1px solid #24242b}
.thumb{position:absolute;left:16px;top:16px;width:108px;height:108px;border-radius:16px;overflow:hidden;background:#222}
.thumb img{height:100%;position:absolute;left:50%;transform:translateX(-50%)}
.card b{position:absolute;left:144px;top:34px;font-size:25px;font-weight:800}
.card span{position:absolute;left:144px;top:72px;font-size:19px;color:#8d8d97;font-weight:600}
#live{position:absolute;left:80px;top:330px;width:1440px;height:156px;border-radius:26px;background:linear-gradient(90deg,rgba(166,107,255,.14),rgba(166,107,255,.04) 60%,rgba(166,107,255,.02));border:1.5px solid rgba(166,107,255,.55);box-shadow:0 0 30px rgba(166,107,255,.18)}
#live .k{position:absolute;left:34px;top:26px;font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--ac)}
#live .k i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ac);margin-right:10px;box-shadow:0 0 10px var(--ac)}
#live .on{position:absolute;right:34px;top:26px;font-size:19px;font-weight:700;color:#b9b9c4}
.av{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;border:3px solid #141418}
#live .txt{position:absolute;left:250px;top:76px;font-size:28px;font-weight:700}
#live .txt small{color:#9a9aa6;font-weight:600}
.sec{position:absolute;left:84px;font-size:30px;font-weight:800}
.sec span{position:absolute;left:1340px;white-space:nowrap;font-size:22px;color:#bdbdc7;font-weight:700}
.rv{position:absolute;left:80px;width:1440px;height:104px;border-radius:20px}
.rv .av{left:18px;top:21px}
.rv b{position:absolute;left:104px;top:22px;font-size:25px;font-weight:800}
.rv small{position:absolute;left:104px;top:58px;font-size:18px;color:#8d8d97;font-weight:600}
.rv .st{position:absolute;left:520px;top:34px;font-size:28px;letter-spacing:4px}
.rv .chev{position:absolute;right:30px;top:34px;width:30px;height:30px}
#exp{position:absolute;left:80px;width:1440px;overflow:hidden}
#exp .in{padding:6px 104px 10px}
.lab{font-size:19px;color:#8d8d97;font-weight:700;margin:12px 0 10px}
.re{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;background:#1f1f25;border:1.5px solid #2b2b33;font-weight:800;font-size:21px;margin-right:12px}
.re.on{border-color:var(--ac);color:#e4d4ff;box-shadow:0 0 16px rgba(166,107,255,.3)}
.cm{display:flex;align-items:flex-start;gap:16px;margin:10px 0}
.cm .av{position:relative;width:44px;height:44px;font-size:17px;border-width:2px}
.cm b{font-size:20px;font-weight:800;display:block}
.cm span{font-size:21px;color:#d9d9e0}
.cm em{font-style:normal;font-size:15px;color:#7f7f8a;font-weight:600;margin-left:8px}
#inp{position:absolute;left:80px;width:1440px;height:92px;border-radius:46px;background:#17171c;border:1.5px solid #2a2a31;display:flex;align-items:center;padding:0 20px 0 34px;gap:16px}
#inp .t{font-size:27px;color:#7e7e88;font-weight:600;flex:1;white-space:nowrap}
#inp .t.v{color:#fff}
#send{width:62px;height:62px;border-radius:50%;background:var(--ac);display:grid;place-items:center;box-shadow:0 0 24px var(--acg)}
.caret{display:inline-block;width:3px;height:30px;background:var(--ac);vertical-align:middle;margin-left:2px}
.bub{position:absolute;padding:16px 26px;border-radius:26px;font-size:26px;font-weight:700;white-space:nowrap}
#step{left:70px;top:46px;display:flex;align-items:baseline;gap:18px;z-index:5}
#band{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(180deg,rgba(9,9,11,0) 0%,rgba(9,9,11,.85) 55%,rgba(9,9,11,.96) 100%);opacity:0;z-index:4}
#step .n{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;font-size:64px;color:var(--ac);text-shadow:0 0 24px var(--acg)}
#step .l{font-size:22px;font-weight:800;letter-spacing:.14em;color:#e2e2ea;text-transform:uppercase}
/* kinetic text */
.kt{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:72px;letter-spacing:-.01em;white-space:nowrap}
.kt .w{display:inline-block;margin:0 .14em}
.kt .a{color:var(--ac);font-style:italic;text-shadow:0 0 30px var(--acg)}
.kpill{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:999px;border:2px solid var(--ac);font-family:Manrope;font-size:34px;font-weight:800;color:#eadcff;margin:0 .2em;box-shadow:0 0 18px var(--acg)}
#icon{left:800px;top:400px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c89bff,#9a5cf5 55%,#6f3fd0);box-shadow:0 0 50px rgba(166,107,255,.7),0 0 140px rgba(166,107,255,.35);display:grid;place-items:center}
#icon img{height:96px;filter:drop-shadow(0 2px 6px rgba(40,0,80,.4))}
#wm{left:770px;top:322px;width:520px}
#wm img{width:520px;display:block}
#tagl{left:780px;top:520px;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:46px;color:var(--ac);text-shadow:0 0 24px var(--acg);white-space:nowrap}
#url{left:0;right:0;top:640px;text-align:center;font-size:32px;font-weight:700;color:#b8b8c2}
#vig{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
</style></head>
<body><div id="ad"></div>
