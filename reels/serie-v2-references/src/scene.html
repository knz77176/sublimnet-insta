<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>SublimNet – scène</title>
<link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="fonts/playfair.css"><link rel="stylesheet" href="fonts/tiktoksans.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
#cam{position:absolute;inset:0;transform-origin:540px 960px}
.abs{position:absolute}
.scr{position:absolute;overflow:hidden;background:#000}
.scr img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.scr .vig{position:absolute;inset:0;pointer-events:none}
.scr .lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,rgba(0,0,0,0) 1px 3px);mix-blend-mode:multiply}
.key{position:absolute;border-radius:9px;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:600}
/* TikTok text */
.tt{position:absolute;left:0;right:0;text-align:center;font-family:'TikTok Sans',Montserrat,sans-serif;font-weight:600;z-index:50}
.tt.box span{display:inline;background:#fff;color:#111;padding:4px 18px 6px;border-radius:14px;line-height:1.36;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tt.shadow{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.8)}
</style></head>
<body><div id="stage"><div id="cam"></div></div>
<script>
const Q = new URLSearchParams(location.search); const V = Q.get('v') || 'A';
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const noise = (t, s = 1) => Math.sin(t * 1.3 + s) * .5 + Math.sin(t * 2.17 + s * 2.3) * .3 + Math.sin(t * 3.71 + s * 4.1) * .2;
const cam = $('#cam'), stage = $('#stage');
const add = (html, parent = cam) => { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; };
let img, light = { r: 0, g: 0, b: 0, l: 0, br: 0, bg: 0, bb: 0, bl: 0 };
const cv = document.createElement('canvas'); cv.width = 32; cv.height = 20; const cx = cv.getContext('2d', { willReadFrequently: true });
function measure() {
  cx.drawImage(img, 0, 0, 32, 20); const d = cx.getImageData(0, 0, 32, 20).data;
  let r = 0, g = 0, b = 0, n = 0, rb = 0, gb = 0, bb = 0, nb = 0;
  for (let y = 0; y < 20; y++) for (let x = 0; x < 32; x++) { const i = (y * 32 + x) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; if (y >= 13) { rb += d[i]; gb += d[i + 1]; bb += d[i + 2]; nb++; } }
  r /= n; g /= n; b /= n; rb /= nb; gb /= nb; bb /= nb;
  // emphasise saturated highlights (glows) a bit
  light = { r, g, b, l: (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255, br: rb, bg: gb, bb, bl: (0.2126 * rb + 0.7152 * gb + 0.0722 * bb) / 255 };
}
function keyboard(rows, kw, kh, gap, color, letterColor, fontSize) {
  let html = '', y = 0;
  rows.forEach((row, ri) => {
    let x = row.off || 0;
    row.keys.forEach(k => {
      const w = (k.w || 1) * kw + ((k.w || 1) - 1) * gap;
      html += `<div class="key" style="left:${x}px;top:${y}px;width:${w}px;height:${kh}px;background:${color};color:${letterColor};font-size:${fontSize}px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.6)">${k.l || ''}</div>`;
      x += w + gap;
    });
    y += kh + gap;
  });
  return html;
}
const AZ = (labels) => labels.split(' ').map(l => ({ l }));
const ROWS = [
  { keys: [{ l: 'esc', w: 1.5 }, ...AZ('F1 F2 F3 F4 F5 F6 F7 F8 F9 F10 F11 F12'), { l: '', w: 1 }], small: true },
  { keys: [{ l: '@' }, ...AZ('& é " \' ( § è ! ç à ) -'), { l: '⌫', w: 1.5 }] },
  { keys: [{ l: '⇥', w: 1.5 }, ...AZ('A Z E R T Y U I O P ^ $'), { l: '', w: 1 }] },
  { keys: [{ l: '⇪', w: 1.8 }, ...AZ('Q S D F G H J K L M ù `'), { l: '↩', w: 0.7 }] },
  { keys: [{ l: '⇧', w: 1.3 }, ...AZ('< W X C V B N , ; : ='), { l: '⇧', w: 2.2 }] },
  { keys: [{ l: 'fn' }, { l: 'ctrl' }, { l: 'alt' }, { l: 'cmd', w: 1.3 }, { l: '', w: 5.6 }, { l: 'cmd', w: 1.3 }, { l: 'alt' }, { l: '◀' }, { l: '▲▼' }, { l: '▶' }] },
];

/* ------------------------------------------------------------- scenes */
const SC = {};
SC.A = { // MacBook in the dark, white UI (ref 1)
  size: [1600, 1000],
  build() {
    add(`<div class="abs" id="room" style="inset:0;background:#000"></div>`);
    add(`<div class="abs" id="spill" style="left:-200px;top:300px;width:1480px;height:1100px;border-radius:50%;filter:blur(90px);opacity:0"></div>`);
    // deck + keyboard in perspective
    const deck = add(`<div class="abs" id="deck" style="left:-70px;top:1140px;width:1220px;height:980px;transform-origin:50% 0;transform:perspective(1000px) rotateX(57deg);
       background:linear-gradient(180deg,#121214 0%,#0b0b0c 45%,#060607 100%);border-radius:10px 10px 40px 40px"></div>`);
    const kb = add(`<div class="abs" style="left:58px;top:60px;width:1110px;height:480px"></div>`, deck);
    kb.innerHTML = keyboard(ROWS.map((r, i) => ({ keys: r.keys, off: 0 })), 72, 66, 9, 'linear-gradient(180deg,#0a0a0b,#050506)', '#2e2e32', 15);
    add(`<div class="abs" style="left:340px;top:600px;width:540px;height:330px;border-radius:22px;background:linear-gradient(180deg,#0c0c0d,#080809);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)"></div>`, deck);
    add(`<div class="abs" id="decklight" style="inset:0;border-radius:inherit;mix-blend-mode:screen"></div>`, deck);
    // hinge + lid
    add(`<div class="abs" style="left:88px;top:1124px;width:904px;height:22px;border-radius:0 0 14px 14px;background:linear-gradient(180deg,#1c1c1e,#0c0c0d)"></div>`);
    add(`<div class="abs" id="lid" style="left:70px;top:528px;width:940px;height:600px;border-radius:26px 26px 8px 8px;background:#060606;box-shadow:0 0 0 1.5px #1d1d1f,0 0 0 2.5px #0a0a0a"></div>`);
    this.scr = add(`<div class="scr" style="left:88px;top:546px;width:904px;height:565px;border-radius:10px 10px 2px 2px"><img id="f"><div class="vig" style="background:radial-gradient(120% 120% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.18) 100%)"></div><div class="lines"></div></div>`);
    add(`<div class="tt box ov" style="top:300px;font-size:44px"><span>Votre voiture nettoyée chez</span><br><span>vous, à Bordeaux 👀</span></div>`, stage);
    add(`<div class="tt box ov" style="top:1240px;font-size:44px"><span>Réservez en 1 minute sur</span><br><span>sublimnet.com</span></div>`, stage);
  },
  light(t) {
    const L = light; const k = 0.25 + 0.75 * L.l;
    $('#spill').style.background = `rgb(${L.r},${L.g},${L.b})`; $('#spill').style.opacity = (0.03 + 0.06 * L.l).toFixed(3);
    $('#decklight').style.background = `linear-gradient(180deg, rgba(${L.br},${L.bg},${L.bb},${(0.45 * k).toFixed(3)}) 0%, rgba(${L.br},${L.bg},${L.bb},${(0.20 * k).toFixed(3)}) 22%, rgba(${L.br},${L.bg},${L.bb},${(0.05 * k).toFixed(3)}) 50%, rgba(0,0,0,0) 72%)`;
    $('#lid').style.boxShadow = `0 0 0 1.5px #1d1d1f,0 0 70px 6px rgba(${L.r},${L.g},${L.b},${(0.04 + 0.08 * L.l).toFixed(3)})`;
    this.scr.querySelector('img').style.filter = `brightness(${0.96}) contrast(1.02) saturate(1.04) blur(0.35px)`;
  },
  camera(t) { return { x: noise(t * 0.7, 1) * 7, y: noise(t * 0.6, 3) * 6, r: noise(t * 0.5, 5) * 0.35, s: 1.0 + noise(t * 0.4, 7) * 0.004 }; },
};
SC.B = { // laptop close-up, dark blue UI (ref 3)
  size: [1600, 1000],
  build() {
    add(`<div class="abs" style="inset:0;background:#010103"></div>`);
    add(`<div class="abs" id="spill" style="left:-100px;top:420px;width:1280px;height:1000px;border-radius:50%;filter:blur(110px);opacity:0"></div>`);
    const deck = add(`<div class="abs" id="deck" style="left:-420px;top:1392px;width:1920px;height:900px;transform-origin:50% 0;transform:perspective(900px) rotateX(52deg);background:linear-gradient(180deg,#0b0b10,#060608)"></div>`);
    const kb = add(`<div class="abs" style="left:40px;top:34px;width:1900px;height:700px"></div>`, deck);
    kb.innerHTML = keyboard(ROWS.slice(1).map((r, i) => ({ keys: r.keys, off: i * 18 })), 122, 112, 14, 'linear-gradient(180deg,#0d0e14,#08080c)', '#2c3150', 26);
    add(`<div class="abs" id="decklight" style="inset:0;mix-blend-mode:screen"></div>`, deck);
    add(`<div class="abs" style="left:-200px;top:1370px;width:1480px;height:26px;background:#030304"></div>`);
    add(`<div class="abs" id="edge" style="left:-200px;top:1368px;width:1480px;height:3px;background:linear-gradient(90deg,rgba(120,125,150,.2),rgba(220,225,245,.95) 45%,rgba(200,205,230,.85) 60%,rgba(90,95,120,.25));box-shadow:0 0 8px rgba(200,210,255,.4)"></div>`);
    this.scr = add(`<div class="scr" style="left:-180px;top:470px;width:1440px;height:900px;background:#020207"><img id="f"><div class="lines" style="opacity:.6"></div></div>`);
    add(`<div class="abs ov" style="left:465px;top:120px;width:150px;height:150px;border-radius:34px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
          <img src="assets/logo_S_p.svg" style="height:78px"><div style="font-family:Manrope;font-weight:700;font-size:20px;color:#2b2b2b;margin-top:2px">SublimNet</div></div>`, stage);
    add(`<div class="tt shadow ov" style="top:298px;font-family:'Playfair Display',serif;font-style:italic;font-weight:900;font-size:66px;letter-spacing:-.01em">Les vrais prix 💸</div>`, stage);
  },
  light(t) {
    const L = light; const k = 0.2 + 0.8 * Math.min(1, L.l * 3.2);
    $('#spill').style.background = `rgb(${Math.min(255, L.r * 2.4)},${Math.min(255, L.g * 2.4)},${Math.min(255, L.b * 2.4)})`; $('#spill').style.opacity = (0.06 + 0.5 * Math.min(1, L.l * 3)).toFixed(3);
    $('#decklight').style.background = `linear-gradient(180deg, rgba(${Math.min(255, L.br * 3)},${Math.min(255, L.bg * 3)},${Math.min(255, L.bb * 3)},${(0.30 * k).toFixed(3)}) 0%, rgba(0,0,0,0) 55%)`;
    this.scr.querySelector('img').style.filter = `brightness(1.06) contrast(1.05) blur(0.45px)`;
  },
  camera(t) { return { x: noise(t * 0.7, 2) * 8, y: noise(t * 0.6, 4) * 7, r: 3.2 + noise(t * 0.5, 6) * 0.45, s: 1.0 + t * 0.0012 }; },
};
SC.C = { // TV on a wooden slat wall, neon violet UI (ref 2)
  size: [1600, 900],
  build() {
    let slats = '';
    for (let x = -20; x < 1100; x += 52) slats += `<div class="abs" style="left:${x}px;top:-40px;width:38px;height:1420px;border-radius:3px;background:linear-gradient(90deg,#1c120b 0%,#2d1d12 45%,#24170e 70%,#160e08 100%)"></div>`;
    add(`<div class="abs" id="wall" style="inset:0;background:#060403">${slats}<div class="abs" id="wallshade" style="inset:0"></div></div>`);
    add(`<div class="abs" style="left:0;top:0;width:1080px;height:150px;background:linear-gradient(180deg,rgba(40,32,26,.55),rgba(0,0,0,0))"></div>`);
    add(`<div class="abs" id="spill" style="left:-160px;top:420px;width:1400px;height:950px;border-radius:50%;filter:blur(120px);opacity:0;mix-blend-mode:screen"></div>`);
    add(`<div class="abs" id="lampglow" style="left:640px;top:1100px;width:700px;height:700px;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,rgba(170,110,255,.55),rgba(170,110,255,0) 70%);mix-blend-mode:screen"></div>`);
    // desk
    add(`<div class="abs" style="left:-40px;top:1330px;width:1160px;height:640px;background:linear-gradient(180deg,#0d0b0a,#050404)"></div>`);
    // TV
    add(`<div class="abs" id="tvb" style="left:30px;top:588px;width:1020px;height:582px;border-radius:10px;background:#050506;box-shadow:0 0 0 2px #121214"></div>`);
    this.scr = add(`<div class="scr" style="left:42px;top:600px;width:996px;height:560px;border-radius:4px"><img id="f"><div class="lines"></div><div class="vig" style="background:radial-gradient(120% 120% at 50% 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.25) 100%)"></div></div>`);
    // laptop on desk (mirrors the ad, dimmer)
    add(`<div class="abs" style="left:288px;top:1210px;width:520px;height:332px;border-radius:14px 14px 4px 4px;background:#070708;box-shadow:0 0 0 1.5px #151517"></div>`);
    this.mini = add(`<div class="scr" style="left:300px;top:1222px;width:496px;height:310px;border-radius:6px"><img id="f2"></div>`);
    const deck = add(`<div class="abs" style="left:250px;top:1540px;width:600px;height:360px;transform-origin:50% 0;transform:perspective(700px) rotateX(62deg);background:linear-gradient(180deg,#151518,#0b0b0d);border-radius:6px"></div>`);
    const kb = add(`<div class="abs" style="left:24px;top:22px;width:560px;height:240px"></div>`, deck);
    kb.innerHTML = keyboard(ROWS.slice(1).map(r => ({ keys: r.keys })), 34, 32, 5, '#0b0b0d', '#25252a', 0);
    add(`<div class="abs" id="kblight" style="inset:0;mix-blend-mode:screen"></div>`, deck);
    // sphere lamp
    add(`<div class="abs" id="lamp" style="left:850px;top:1320px;width:236px;height:236px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#f3e9ff 0%,#c8a2ff 28%,#9a63f0 62%,#6a3cc0 100%);box-shadow:0 0 60px 18px rgba(166,107,255,.55),0 0 160px 60px rgba(166,107,255,.25)"></div>`);
    add(`<div class="abs" style="left:860px;top:1560px;width:220px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(166,107,255,.35),rgba(0,0,0,0) 70%);filter:blur(6px)"></div>`);
    add(`<div class="tt shadow ov" style="top:1236px;left:60px;right:auto;width:560px;font-size:46px;line-height:1.18">5 raisons de choisir<br>SublimNet 👇</div>`, stage);
  },
  light(t) {
    const L = light; const k = Math.min(1, L.l * 2.6);
    $('#spill').style.background = `rgb(${Math.min(255, L.r * 2.2)},${Math.min(255, L.g * 2.2)},${Math.min(255, L.b * 2.2)})`; $('#spill').style.opacity = (0.08 + 0.42 * k).toFixed(3);
    $('#wallshade').style.background = `radial-gradient(70% 45% at 50% 46%, rgba(0,0,0,${(0.55 - 0.25 * k).toFixed(3)}) 0%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.86) 100%)`;
    $('#kblight').style.background = `linear-gradient(180deg, rgba(${L.r},${L.g},${L.b},${(0.15 + 0.25 * k).toFixed(3)}), rgba(0,0,0,0) 70%)`;
    this.scr.querySelector('img').style.filter = `brightness(1.08) contrast(1.04) blur(0.5px)`;
    this.mini.querySelector('img').style.filter = `brightness(.85) blur(0.6px)`;
    $('#lamp').style.transform = `scale(${1 + Math.sin(t * 0.8) * 0.004})`;
  },
  camera(t) { return { x: noise(t * 0.6, 3) * 7, y: noise(t * 0.55, 5) * 6, r: -0.4 + noise(t * 0.45, 8) * 0.3, s: 1.0 + noise(t * 0.35, 9) * 0.004 }; },
};
const S = SC[V];
S.build();
const OV = Q.get('ov') || 'all';
if (OV === 'none') document.querySelectorAll('.ov').forEach(e => e.remove());
if (OV === 'only') { cam.style.display = 'none'; document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; stage.style.background = 'transparent'; }
img = document.getElementById('f');
const img2 = document.getElementById('f2');
let pending = null;
window.render = t => {
  const i = Math.min(Math.round(t * 30), (window.NFR || 1e9) - 1);
  const src = `f${V}/f${String(i).padStart(5, '0')}.png`;
  pending = new Promise(res => {
    const done = () => { try { measure(); } catch (e) {} S.light(t); res(); };
    if (img.getAttribute('src') === src && img.complete) { done(); return; }
    img.onload = () => { if (img2) { img2.onload = done; img2.src = src; } else done(); };
    img.onerror = () => res();
    img.src = src;
  });
  const c = S.camera(t);
  cam.style.transform = `translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px) rotate(${c.r.toFixed(3)}deg) scale(${c.s.toFixed(4)})`;
};
window.__frameReady = () => pending;
window.__ready = (async () => { await document.fonts.ready; return true; })();
</script>
</body></html>
