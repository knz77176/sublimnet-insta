<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>SublimNet – Prix</title>
<link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="fonts/playfair.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden;background:#07060F}
#ad{position:absolute;inset:0;overflow:hidden;background:radial-gradient(60% 70% at 50% 55%,#171030 0%,#0E0B1D 55%,#07060F 100%);font-family:Manrope,sans-serif;color:#fff}
.abs{position:absolute}
.ctr{left:50%;top:50%;transform:translate(-50%,-50%)}
#chip{width:58px;height:38px;margin:-19px 0 0 -29px;left:800px;top:500px;border-radius:9px;background:linear-gradient(135deg,#C9C2E3,#8B7CC7 40%,#5A3B8C);box-shadow:0 0 30px 8px rgba(139,124,199,.85),0 0 90px 20px rgba(90,59,140,.55)}
#burst{left:0;top:0;width:1600px;height:1000px}
.logoW{width:640px}
.logoW img{width:640px;display:block;filter:drop-shadow(0 0 22px rgba(139,124,199,.6))}
#logo1{left:480px;top:390px}
.head{left:0;right:0;text-align:center;font-family:'Playfair Display',serif;font-weight:800;font-size:96px;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 0%,#C9C2E3 55%,#8B7CC7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.head .w{display:inline-block;margin:0 .1em;background:linear-gradient(180deg,#ffffff 0%,#C9C2E3 55%,#8B7CC7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
#flash{left:0;top:0;width:1600px;height:1000px;background:radial-gradient(40% 45% at 50% 50%,rgba(240,236,255,1) 0%,rgba(139,124,199,.8) 30%,rgba(90,59,140,.3) 60%,rgba(0,0,0,0) 80%);opacity:0}
/* phone */
#pwrap{left:800px;top:600px;width:0;height:0;perspective:1600px}
#phone{position:absolute;left:-190px;top:-390px;width:380px;height:780px;border-radius:58px;background:#0E0B1D;border:2px solid #2A1E4D;
  box-shadow:0 0 0 1px #150f2a inset,0 40px 120px rgba(90,59,140,.35),0 0 60px rgba(139,124,199,.22);transform-style:preserve-3d;overflow:hidden}
#phone .isl{position:absolute;left:140px;top:14px;width:100px;height:28px;border-radius:16px;background:#000}
#phone .st{position:absolute;left:34px;right:30px;top:18px;display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:#C9C2E3}
.scr{position:absolute;left:0;top:60px;width:376px;bottom:0;padding:18px 26px}
.scr .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.scr .hd img{height:30px;filter:brightness(0) invert(1)}
.scr .hd span{font-size:14px;color:#8B7CC7;font-weight:700}
.scr h4{font-size:34px;font-weight:800;letter-spacing:-.01em}
.scr p{font-size:15px;color:#8A87A3;margin:4px 0 20px}
.row{display:flex;align-items:center;gap:14px;padding:14px 14px;border-radius:16px;background:#150F2B;margin-bottom:10px;border:1px solid #2A1E4D}
.row i{width:38px;height:38px;border-radius:50%;background:#2A1E4D;display:grid;place-items:center;font-style:normal;font-size:16px;color:#C9C2E3;font-weight:800}
.row b{font-size:18px;font-weight:700}
.row small{display:block;font-size:13px;color:#8A87A3;font-weight:600}
.row em{margin-left:auto;font-style:normal;font-weight:800;font-size:19px}
.row.hl{border-color:#8B7CC7;box-shadow:0 0 0 1px #8B7CC7 inset,0 0 26px rgba(139,124,199,.4)}
.pbtn{position:absolute;left:26px;right:26px;bottom:30px;height:56px;border-radius:28px;background:linear-gradient(95deg,#5A3B8C,#8B7CC7);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 0 30px rgba(139,124,199,.5)}
/* pill */
.pill{position:absolute;left:800px;transform:translate(-50%,-50%);padding:18px 46px;border-radius:999px;background:rgba(14,11,29,.9);
  border:2px solid rgba(139,124,199,.95);box-shadow:0 0 0 1px rgba(139,124,199,.25),0 0 40px rgba(139,124,199,.55),inset 0 0 26px rgba(90,59,140,.35);
  font-weight:800;font-size:60px;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:baseline;gap:16px}
.pill small{font-size:30px;font-weight:700;color:#C9C2E3}
.num{display:inline-flex;align-items:baseline}
.dg{display:inline-block;height:1.15em;overflow:hidden;position:relative;line-height:1.15em}
.dg span{display:block}
.sp{display:inline-block}
/* card */
#card{left:540px;top:330px;width:520px;height:328px;border-radius:30px;overflow:hidden}
#card .fillc{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 0%,#C9C2E3 0%,#8B7CC7 28%,#5A3B8C 62%,#2A1E4D 100%);opacity:0}
#card .ct{position:absolute;inset:0;padding:28px 32px;opacity:0}
#card .ct img{height:42px;filter:brightness(0) invert(1)}
#card .chipA{position:absolute;right:30px;top:30px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:800;font-size:18px}
#card .lb{position:absolute;left:32px;bottom:30px;font-size:22px;font-weight:700;color:rgba(255,255,255,.88)}
#card .pr{position:absolute;right:32px;bottom:24px;font-size:52px;font-weight:800}
#cardline{left:0;top:0;width:1600px;height:1000px}
.tx{position:absolute;left:520px;width:560px;display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:20px;background:rgba(21,15,43,.94);border:1px solid #2A1E4D;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tx i{width:40px;height:40px;border-radius:50%;background:#2A1E4D;display:grid;place-items:center;font-style:normal;color:#C9C2E3;font-weight:800}
.tx b{font-size:21px} .tx small{display:block;font-size:15px;color:#8A87A3;font-weight:600}
.tx em{margin-left:auto;font-style:normal;font-weight:800;font-size:24px;color:#C9C2E3}
.ripple{position:absolute;border-radius:50%;border:2px solid rgba(139,124,199,.7);transform:translate(-50%,-50%)}
/* map */
#map{left:0;top:0;width:1600px;height:1000px}
.mpin{position:absolute;transform:translate(-50%,-50%)}
.mpin .d{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px rgba(139,124,199,.95)}
.mpin .l{position:absolute;left:50%;top:-58px;transform:translateX(-50%);white-space:nowrap;padding:8px 16px;border-radius:12px;background:rgba(21,15,43,.92);border:1px solid #2A1E4D;font-size:19px;font-weight:700}
.mpin .l small{display:block;font-size:13px;color:#8A87A3}
#kmpill{position:absolute;padding:8px 18px;border-radius:999px;background:#5A3B8C;font-weight:800;font-size:20px;box-shadow:0 0 24px rgba(139,124,199,.85);transform:translate(-50%,-50%)}
#offpill{left:800px;top:860px;transform:translate(-50%,-50%);padding:16px 36px;border-radius:999px;background:rgba(42,30,77,.92);border:2px solid #C9C2E3;color:#E9E4F7;font-weight:800;font-size:34px;box-shadow:0 0 30px rgba(201,194,227,.45)}
/* total */
#tot{left:0;right:0;top:170px;text-align:center}
#tot small{display:block;font-size:24px;color:#8B7CC7;font-weight:700;letter-spacing:.02em}
#tot .big{font-size:120px;font-weight:800;letter-spacing:-.03em;margin-top:4px;display:inline-flex;align-items:baseline}
#tline{left:0;right:0;text-align:center;font-size:40px;font-weight:700;color:#C9C2E3}
#tline b{color:#8B7CC7;font-weight:800}
#dotend{left:800px;top:500px;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#8B7CC7;box-shadow:0 0 30px 12px rgba(139,124,199,.85);opacity:0}
</style></head>
<body><div id="ad"></div>
<script src="adkit.js"></script>
<script>
const {clamp, lerp, P, eio, eo, eo4, eo5, eob, spring, $, el, on, end, W, WE, typed, fmt, noise} = K;
let T = {};
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function burstSVG(id) {
  let s = `<svg id="${id}" class="abs" style="left:0;top:0" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><radialGradient id="${id}g" gradientUnits="userSpaceOnUse" cx="800" cy="500" r="560">
    <stop offset="0" stop-color="#C9C2E3" stop-opacity="0"/><stop offset=".16" stop-color="#E4DFF4" stop-opacity=".95"/><stop offset=".45" stop-color="#8B7CC7" stop-opacity=".75"/><stop offset="1" stop-color="#5A3B8C" stop-opacity="0"/></radialGradient></defs><g stroke="url(#${id}g)" stroke-linecap="round">`;
  for (let i = 0; i < 150; i++) {
    const a = rnd() * Math.PI * 2, r1 = 70 + rnd() * 110, r2 = r1 + 140 + rnd() * 380, w = 0.8 + rnd() * 2.2;
    s += `<line x1="${800 + Math.cos(a) * r1}" y1="${500 + Math.sin(a) * r1}" x2="${800 + Math.cos(a) * r2}" y2="${500 + Math.sin(a) * r2}" stroke-width="${w.toFixed(2)}"/>`;
  }
  return s + `</g><circle cx="800" cy="500" r="250" fill="none" stroke="#8B7CC7" stroke-opacity=".25" stroke-width="2"/></svg>`;
}
function rollNum(v, dec = 2) {
  // rolling digits: returns html (digits shift by fractional part)
  const cents = v * Math.pow(10, dec);
  const s = fmt(Math.floor(cents) / Math.pow(10, dec), dec);
  const digits = s.replace(/\D/g, '').length;
  let html = '', k = digits - 1;
  for (const ch of s) {
    if (/\d/.test(ch)) {
      const unit = Math.pow(10, k);
      const x = cents / unit; const d = Math.floor(x) % 10; let f = x - Math.floor(x);
      f = k === 0 ? f : clamp((f - 0.9) * 10);
      html += `<span class="dg"><span style="transform:translateY(${(-f * 100).toFixed(1)}%)">${d}</span><span style="transform:translateY(${(-f * 100).toFixed(1)}%)">${(d + 1) % 10}</span></span>`;
      k--;
    } else html += `<span class="sp">${ch === ' ' ? '&#8239;' : ch}</span>`;
  }
  return html;
}
function screenHTML(title, sub, rows, hl) {
  return `<div class="hd"><img src="assets/logo.svg"><span>sublimnet.com</span></div><h4>${title}</h4><p>${sub}</p>` +
    rows.map((r, i) => `<div class="row${i === hl ? ' hl' : ''}"><i>${r[0]}</i><div><b>${r[1]}</b><small>${r[2]}</small></div><em>${r[3]}</em></div>`).join('') +
    `<div class="pbtn">Réserver en ligne</div>`;
}
function build() {
  const ad = $('#ad');
  el('div', 'abs', '', ad).id = 'chip';
  const b1 = el('div', 'abs', burstSVG('bs1'), ad); b1.id = 'b1w'; b1.style.inset = '0';
  el('div', 'abs logoW', '<img src="assets/logo_w2.svg">', ad).id = 'logo1';
  const h0 = el('div', 'abs head', '', ad); h0.id = 'h0'; h0.style.top = '440px';
  h0.innerHTML = 'Combien ça coûte ?'.split(' ').map(w => `<span class="w">${w}</span>`).join('');
  // headings
  T.heads = {};
  [['hCan', 'Canapé.'], ['hMat', 'Matelas.'], ['hVoi', 'Voiture.'], ['hDep', 'Déplacement offert.']].forEach(([id, s]) => {
    const h = el('div', 'abs head', s, ad); h.id = id; h.style.top = '70px'; h.style.fontSize = '84px'; T.heads[id] = h; });
  // phone
  const pw = el('div', 'abs', `<div id="phone"><div class="isl"></div><div class="st"><span>10:02</span><span>●●● ▮</span></div>
     <div class="scr" id="sc1">${screenHTML('Canapé', 'De 2 à 7 places · à domicile', [['2', '2 places', 'Assise + dossier', '40 €'], ['3', '3 places', 'Assise + dossier', '50 €'], ['4', '4 places', 'Assise + dossier', '60 €'], ['6', '6 places', 'Angle compris', '80 €'], ['7', '7 places', 'Grand angle', '90 €']], 0)}</div>
     <div class="scr" id="sc2">${screenHTML('Matelas', 'Enfant, 1 ou 2 places', [['E', 'Matelas enfant', 'Les deux faces', '35 €'], ['1', '1 place', 'Les deux faces', '45 €'], ['2', '2 places', 'Les deux faces', '65 €']], 0)}</div>
     <div class="scr" id="sc3"><div class="hd"><img src="assets/logo.svg"><span>Récapitulatif</span></div>
        <div class="row"><i>✓</i><div><b>Canapé · 3 places</b><small>Dim. · 14:30</small></div><em>50 €</em></div>
        <div class="row"><i>✓</i><div><b>Déplacement</b><small>2,5 km · Bordeaux</small></div><em style="color:#C9C2E3">Offert</em></div>
        <div class="row"><i>✓</i><div><b>Créneau</b><small>7j/7 · 07:30 ou 14:30</small></div><em>14:30</em></div>
        <div class="pbtn" id="rsv">Réserver</div></div></div>`, ad);
  pw.id = 'pwrap';
  T.pills = {};
  [['pCan', 40], ['pMat', 35]].forEach(([id]) => { const p = el('div', 'pill', '', ad); p.id = id; p.style.top = '560px'; T.pills[id] = p; });
  // card
  el('div', 'abs', `<svg width="1600" height="1000"><defs><filter id="glw" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
     <rect id="cl" x="540" y="330" width="520" height="328" rx="30" fill="none" stroke="#C9C2E3" stroke-width="3" filter="url(#glw)" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
     <circle id="clh" r="7" fill="#fff" filter="url(#glw)"/>
     <path id="arcA" d="M700 260 A 260 260 0 0 1 960 520" fill="none" stroke="#C9C2E3" stroke-width="3" filter="url(#glw)" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
     <path id="arcB" d="M900 740 A 260 260 0 0 1 640 480" fill="none" stroke="#C9C2E3" stroke-width="3" filter="url(#glw)" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/></svg>`, ad).id = 'cardline';
  el('div', 'abs', `<div class="fillc"></div><div class="ct"><img src="assets/logo.svg"><div class="chipA">Auto</div><div class="lb">Extérieur · Citadine</div><div class="pr"><span id="nAuto">0</span> €</div></div>`, ad).id = 'card';
  T.tx = [['✓', 'Express', 'Intérieur sans sièges', '50 €'], ['✓', 'Confort', 'Intérieur, sièges inclus', '90 €']].map((r, i) => {
    const x = el('div', 'tx', `<i>${r[0]}</i><div><b>${r[1]}</b><small>${r[2]}</small></div><em>${r[3]}</em>`, ad); x.style.top = (690 + i * 96) + 'px'; return x; });
  T.rip = [0, 1, 2].map(() => el('div', 'ripple', '', ad));
  // map (dot matrix)
  const map = el('div', 'abs', '', ad); map.id = 'map';
  let dots = '';
  const inside = (x, y) => {
    const e = (cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
    return Math.min(e(800, 560, 520, 330), e(560, 470, 280, 240), e(1080, 620, 300, 220), e(900, 360, 260, 160)) < 1 && !(Math.abs((y - 480) - (x - 760) * -0.38) < 16 && x > 540 && x < 1180);
  };
  for (let y = 200; y < 940; y += 15) for (let x = 230; x < 1370; x += 15) {
    if (!inside(x, y)) continue;
    const dd = Math.hypot(x - 760, y - 560); const a = clamp(0.95 - dd / 640, 0.18, 0.95);
    dots += `<circle cx="${x}" cy="${y}" r="2.7" fill="#8B7CC7" fill-opacity="${a.toFixed(2)}"/>`;
  }
  map.innerHTML = `<svg width="1600" height="1000"><defs><filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="rad" cx="0.5" cy="0.5" r="0.5"><stop offset="0.75" stop-color="#8B7CC7" stop-opacity="0"/><stop offset="1" stop-color="#8B7CC7" stop-opacity=".35"/></radialGradient></defs>
    <g id="dots">${dots}</g>
    <circle id="radc" cx="700" cy="620" r="10" fill="url(#rad)" stroke="#8B7CC7" stroke-width="2.5" stroke-dasharray="8 10" filter="url(#g2)"/>
    <path id="route" d="M700 620 Q 760 470 880 470" fill="none" stroke="#C9C2E3" stroke-width="4" stroke-linecap="round" filter="url(#g2)" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/></svg>
    <div class="mpin" id="pinA" style="left:700px;top:620px"><div class="d"></div><div class="l">SublimNet<small>Talence</small></div></div>
    <div class="mpin" id="pinB" style="left:880px;top:470px"><div class="d"></div><div class="l">Chez vous<small>Bordeaux</small></div></div>
    <div id="kmpill">2,5 km</div>`;
  el('div', 'abs', 'Déplacement offert · 20 km', ad).id = 'offpill';
  // total
  el('div', 'abs', `<small>Total affiché avant de réserver</small><div class="big" id="tnum"></div>`, ad).id = 'tot';
  // end
  const b2 = el('div', 'abs', burstSVG('bs2'), ad); b2.id = 'b2w'; b2.style.inset = '0';
  el('div', 'abs logoW', '<img src="assets/logo_w2.svg">', ad).id = 'logo2';
  el('div', 'abs', '', ad).id = 'tline';
  el('div', 'abs', '', ad).id = 'flash';
  el('div', 'abs', '', ad).id = 'dotend';

  T.t = {
    chip: 0.15, burst: 0.9, comb: W('b1', 'combien') - 0.32, flash: end('b1') + 0.25,
    can: on('b2') - 0.15, dCan: W('b2', 'dès'),
    mat: on('b3') - 0.25, dMat: W('b3', 'dès'),
    voi: on('b4') - 0.35, dAuto: W('b4', 'dès'), tx: W('b4', 'dès') + 0.25,
    dep: on('b5') - 0.45, km: W('b5', 'vingt') - 0.3, off: W('b5', 'offert') - 0.1,
    tot: on('b6') - 0.4, tnum: W('b6', 'total') - 0.05, rsv: W('b6', 'réserver') - 0.1,
    arcs: on('b7') - 0.75, logo: on('b7') + 0.05, tag: W('b7', 'réservez') - 0.05, tagE: end('b7') - 0.05, fin: K.VO.duration - 0.9,
  };
}
function showHead(h, tt, a, b) {
  const q = eo(P(tt, a, a + 0.55)), o = eio(P(tt, b, b + 0.35));
  h.style.opacity = (q * (1 - o)).toFixed(3);
  h.style.filter = `blur(${((1 - q) * 14 + o * 12).toFixed(1)}px)`;
  h.style.transform = `translateY(${((1 - q) * 26 - o * 18).toFixed(1)}px) scale(${0.96 + 0.04 * q})`;
}
function render(tt) {
  const t = T.t, D = K.VO.duration;
  // intro chip -> burst -> logo
  const ch = $('#chip'); const cq = eo(P(tt, t.chip, t.burst));
  ch.style.opacity = (clamp(P(tt, t.chip, t.chip + 0.2)) * (1 - P(tt, t.burst, t.burst + 0.15))).toFixed(3);
  ch.style.transform = `perspective(600px) rotateY(${(1 - cq) * 70}deg) rotateZ(${(1 - cq) * -20}deg) scale(${0.4 + cq * 1.4})`;
  const bw = $('#b1w'); const bq = P(tt, t.burst, t.burst + 1.6);
  bw.style.opacity = (Math.sin(clamp(bq) * Math.PI) * (bq < 0.2 ? bq / 0.2 : 1)).toFixed(3);
  bw.style.transform = `scale(${0.55 + eo(bq) * 0.65}) rotate(${bq * 8}deg)`;
  const L1 = $('#logo1'); const lq = eo(P(tt, t.burst + 0.05, t.burst + 0.6)); const lo = eio(P(tt, t.comb, t.comb + 0.5));
  L1.style.opacity = (lq * (1 - lo)).toFixed(3);
  L1.style.filter = `blur(${((1 - lq) * 12 + lo * 16).toFixed(1)}px) brightness(${1 + (1 - lq) * 1.5})`;
  L1.style.transform = `scale(${(0.9 + 0.1 * lq + tt * 0.004) * (1 + lo * 0.15)})`;
  const h0 = $('#h0'); const ws = h0.querySelectorAll('.w');
  const ho = eio(P(tt, t.flash - 0.1, t.flash + 0.25));
  ws.forEach((w, i) => { const d = t.comb + 0.15 + i * 0.12; const q = eo(P(tt, d, d + 0.5));
    w.style.opacity = (q * (1 - ho)).toFixed(3); w.style.filter = `blur(${((1 - q) * 12).toFixed(1)}px)`; w.style.transform = `translateY(${(1 - q) * 22}px)`; });
  const fl = $('#flash'); const fq = P(tt, t.flash, t.flash + 0.75);
  const f2 = P(tt, t.arcs + 1.05, t.arcs + 1.55);
  fl.style.opacity = Math.max(Math.sin(fq * Math.PI) * 0.95, Math.sin(f2 * Math.PI) * 0.7).toFixed(3);
  fl.style.transform = `scale(${0.4 + Math.max(fq, f2) * 1.4})`;
  // phone
  const pin = eo(P(tt, t.flash + 0.2, t.flash + 0.95)), pout = eio(P(tt, t.voi, t.voi + 0.5)), pin2 = eo(P(tt, t.tot, t.tot + 0.7)), pout2 = eio(P(tt, t.arcs - 0.2, t.arcs + 0.2));
  const ph = $('#phone'); const vis = tt < t.dep ? pin * (1 - pout) : pin2 * (1 - pout2);
  const ry = tt < t.dep ? lerp(-34, -12, eio(P(tt, t.flash, t.voi))) + noise(tt * 0.6, 2) * 3 : lerp(18, 6, eio(P(tt, t.tot, t.arcs))) ;
  const rx = 9 + noise(tt * 0.5, 5) * 2;
  const ty = tt < t.dep ? (1 - pin) * 120 + pout * 160 : 260 + (1 - pin2) * 140;
