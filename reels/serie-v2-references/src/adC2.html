<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>SublimNet – Pourquoi (plein écran)</title>
<link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="fonts/playfair.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0E0B1D;--in:#2A1E4D;--pu:#5A3B8C;--la:#8B7CC7;--li:#C9C2E3;--sl:#3A3A52;--glow:rgba(139,124,199,.55)}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#ad{position:absolute;inset:0;overflow:hidden;background:radial-gradient(90% 60% at 50% 38%,#1C1538 0%,#0E0B1D 62%,#09071300 100%),#0E0B1D;font-family:Manrope,sans-serif;color:#fff}
.abs{position:absolute}
#cam{position:absolute;inset:0;perspective:2200px}
#ui{position:absolute;left:0;top:0;width:1080px;height:3000px;transform-origin:0 0}
.chip{position:absolute;top:200px;height:78px;padding:0 36px;border-radius:999px;background:#191331;color:var(--li);font-weight:700;font-size:31px;display:flex;align-items:center;border:2px solid var(--sl);white-space:nowrap}
.chip.on{background:var(--la);color:var(--bg);border-color:var(--la);box-shadow:0 0 26px var(--glow),0 0 70px rgba(139,124,199,.25)}
.card{position:absolute;left:60px;width:960px;border-radius:34px;background:#171030;border:1.5px solid var(--in)}
#ba{top:330px;height:600px}
.ph{position:absolute;top:22px;width:448px;height:440px;border-radius:24px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph b{position:absolute;bottom:16px;left:16px;padding:7px 16px;border-radius:999px;font-size:18px;letter-spacing:.12em;font-weight:800}
#ba h3{position:absolute;left:34px;top:486px;font-size:36px;font-weight:800}
#ba p{position:absolute;left:34px;top:536px;font-size:25px;color:#a9a3c4;font-weight:600}
#live{top:970px;height:250px;background:linear-gradient(90deg,rgba(139,124,199,.18),rgba(139,124,199,.05) 70%);border:2px solid rgba(139,124,199,.6);box-shadow:0 0 34px rgba(139,124,199,.2)}
#live .k{position:absolute;left:38px;top:32px;font-size:24px;font-weight:800;letter-spacing:.14em;color:var(--la)}
#live .k i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--la);margin-right:12px;box-shadow:0 0 12px var(--la)}
#live .on{position:absolute;right:38px;top:32px;font-size:23px;font-weight:700;color:var(--li)}
.av{position:absolute;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:32px;color:#fff;border:4px solid #171030}
#live .txt{position:absolute;left:270px;top:100px;font-size:40px;font-weight:800;line-height:1.2}
#live .txt small{display:block;font-size:26px;color:#a9a3c4;font-weight:600}
.sec{position:absolute;left:64px;top:1290px;font-size:40px;font-weight:800}
.sec span{position:absolute;left:640px;top:6px;white-space:nowrap;font-size:28px;color:var(--li);font-weight:700}
.rv{position:absolute;left:60px;width:960px;height:150px;border-radius:28px}
.rv .av{left:22px;top:33px}
.rv b{position:absolute;left:128px;top:34px;font-size:33px;font-weight:800}
.rv small{position:absolute;left:128px;top:82px;font-size:23px;color:#a9a3c4;font-weight:600}
.rv .st{position:absolute;right:86px;top:50px;font-size:34px;letter-spacing:4px}
.rv .chev{position:absolute;right:26px;top:54px;width:38px;height:38px}
#exp{position:absolute;left:60px;width:960px;overflow:hidden;border-radius:0 0 28px 28px;background:#171030}
#exp .in{padding:4px 40px 20px 128px}
.lab{font-size:24px;color:#a9a3c4;font-weight:700;margin:14px 0 12px}
.re{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;background:#1d1638;border:2px solid var(--sl);font-weight:800;font-size:27px;margin-right:12px}
.re.on{border-color:var(--la);color:#efeaff;box-shadow:0 0 18px rgba(139,124,199,.35)}
.cm{display:flex;align-items:flex-start;gap:18px;margin:14px 0}
.cm .av{position:relative;width:60px;height:60px;font-size:24px;border-width:2px;flex:none}
.cm b{font-size:26px;font-weight:800;display:block}
.cm span{font-size:28px;color:#e6e1f5;font-weight:600}

#inp .t{font-size:34px;color:#8A87A3;font-weight:600;flex:1;white-space:nowrap}
#inp .t.v{color:#fff}
#send{width:84px;height:84px;border-radius:50%;background:var(--la);display:grid;place-items:center;box-shadow:0 0 26px var(--glow)}
.caret{display:inline-block;width:4px;height:40px;background:var(--la);vertical-align:middle;margin-left:3px}
.bub{position:absolute;padding:22px 34px;border-radius:36px;font-size:34px;font-weight:700;white-space:nowrap}

#title .w{display:inline-block;margin:0 .1em}
#title .a{font-style:italic;color:var(--la);text-shadow:0 0 34px var(--glow)}
#dim{position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 30%,rgba(14,11,29,.55),rgba(14,11,29,.85));z-index:5;opacity:0}
#band{position:absolute;left:0;right:0;top:1220px;height:700px;background:linear-gradient(180deg,rgba(14,11,29,0) 0%,rgba(14,11,29,.9) 32%,rgba(14,11,29,.97) 100%);opacity:0;z-index:4}

#step .n{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;font-size:96px;color:var(--la);text-shadow:0 0 28px var(--glow)}
#step .l{font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--li);text-transform:uppercase}
.kt{position:absolute;left:0;right:0;top:760px;text-align:center;font-family:'Playfair Display',serif;font-weight:700;font-size:108px;line-height:1.16;letter-spacing:-.01em;z-index:6}
.kt .w{display:inline-block;margin:0 .1em}
.kt .a{color:var(--la);font-style:italic;text-shadow:0 0 34px var(--glow)}
.kpill{display:inline-flex;align-items:center;gap:12px;padding:10px 26px;border-radius:999px;border:3px solid var(--la);font-family:Manrope;font-size:50px;font-weight:800;color:#efeaff;margin:0 .15em;box-shadow:0 0 22px var(--glow);vertical-align:middle}
#icon{left:540px;top:700px;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C9C2E3,#8B7CC7 45%,#5A3B8C 85%);box-shadow:0 0 60px rgba(139,124,199,.75),0 0 170px rgba(139,124,199,.35);display:grid;place-items:center;z-index:7}
#icon img{height:150px}
#wm{left:150px;top:860px;width:780px;z-index:7}
#wm img{width:780px;display:block;filter:drop-shadow(0 0 24px rgba(139,124,199,.45))}
#tagl{left:0;right:0;top:1150px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:70px;color:var(--la);text-shadow:0 0 30px var(--glow);z-index:7}
#url{left:0;right:0;top:1268px;text-align:center;font-size:44px;font-weight:700;color:var(--li);z-index:7}
#cta{left:290px;top:1360px;width:500px;height:104px;border-radius:52px;background:linear-gradient(95deg,#5A3B8C,#8B7CC7);display:grid;place-items:center;font-size:38px;font-weight:800;box-shadow:0 0 40px rgba(139,124,199,.5);z-index:7}
#vig{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,12,.6) 100%);pointer-events:none;z-index:8}
</style></head>
<body><div id="ad"></div>

  const t = T.t;

    [t.live, t.live + 0.7, { cx: 540, cy: 1095, s: 1.2, rx: 6, rz: -2 }],

    [t.expand, t.expand + 0.7, { cx: 540, cy: 1640, s: 1.1, rx: 4, rz: 1 }],
    [t.inp, t.inp + 0.65, { cx: 470, cy: 0, s: 1.55, rx: 2, rz: -1, inp: true }],
    [t.reply - 0.15, t.reply + 0.5, { cx: 540, cy: 0, s: 1.06, rx: 4, rz: -2, bub: true }],

}
function layoutUI(tt) {
  const t = T.t;
  const ex = eio(P(tt, t.expand, t.expand + 0.55)); const exH = 520 * ex;
  T.revs.forEach((r, i) => { r.style.top = (1370 + i * 162 + (i > 0 ? exH : 0)) + 'px'; });
  const E = $('#exp'); E.style.top = (1370 + 146) + 'px'; E.style.height = exH + 'px'; E.style.opacity = ex.toFixed(3);

  T.revs[0].style.borderRadius = ex > 0.05 ? '28px 28px 0 0' : '28px';

  b2.style.left = '60px'; b2.style.top = (base + 290) + 'px'; b2.style.background = '#2A1E4D'; b2.style.border = '2px solid #3A3A52';
  b2.style.opacity = clamp(P(tt, t.reply, t.reply + 0.12)).toFixed(3); b2.style.transform = `translateY(${(1 - s2) * 30}px) scale(${0.7 + 0.3 * s2})`; b2.style.transformOrigin = '0 50%';

function render(tt) {
