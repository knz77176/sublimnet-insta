      <div class="pair" id="pairW" style="opacity:0"><img src="assets/wheel_av.jpg"><img id="wAp" src="assets/wheel_ap.jpg"><div id="slider"><i>⇆</i></div></div>
      <div class="ptag" style="left:18px">Coup de cœur clients</div>

  T.cf = [];

  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 46; i++) {

function cursorPos(tt) {
  const C = T.cursor;
  if (tt <= C[0][0]) return { x: C[0][1], y: C[0][2], o: 0 };
  for (let i = 0; i < C.length - 1; i++) {
    const [t0, x0, y0] = C[i], [t1, x1, y1] = C[i + 1];
    if (tt <= t1) {
      const q = eio(P(tt, t0, t1));
      // slight arc
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 - Math.min(80, Math.hypot(x1 - x0, y1 - y0) * 0.12);

      const y = (1 - q) * (1 - q) * y0 + 2 * (1 - q) * q * my + q * q * y1;
      return { x, y, o: 1 };
    }
  }
  const L = C[C.length - 1]; return { x: L[1], y: L[2], o: 1 };
}

function render(tt) {
  const t = T.t;

    p.style.filter = `blur(${(out * 14 + (1 - clamp(P(tt, t.pills[i], t.pills[i] + 0.25))) * 8).toFixed(2)}px)`;
