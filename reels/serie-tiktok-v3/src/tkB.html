<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>SublimNet TikTok – Combien ça coûte</title>
<link rel="stylesheet" href="pfd/pfd.css">
<link rel="stylesheet" href="tk.css">
<style>
#sEnd{background:radial-gradient(70% 45% at 50% 40%,#3a2870 0%,#1a1236 45%,#0E0B1D 80%)}
.cta{position:absolute;left:90px;right:90px;height:150px;border-radius:75px;display:grid;place-items:center;font-weight:900;font-size:62px;z-index:50}
.spark{position:absolute;width:40px;height:40px;z-index:25}
#pip{position:absolute;left:46px;top:330px;width:300px;height:533px;border-radius:30px;overflow:hidden;border:6px solid #fff;box-shadow:0 20px 50px rgba(14,11,29,.6);z-index:20}
#pip img,.full #pip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#pip .lab{left:14px;bottom:14px;top:auto;font-size:30px;padding:8px 18px}
.pcard{position:absolute;left:150px;top:520px;width:780px;height:700px;border-radius:56px;background:linear-gradient(160deg,#2A1E4D,#16102c);border:4px solid #5A3B8C;
  box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 80px rgba(139,124,199,.35);text-align:center;z-index:10}
.pcard .em{font-family:'Noto Color Emoji';font-size:170px;line-height:1;margin-top:60px}
.pcard h3{font-size:92px;font-weight:900;margin-top:16px}
.pcard p{font-size:38px;color:#C9C2E3;font-weight:700;margin-top:4px}
.pcard .pr{font-size:170px;font-weight:900;line-height:1.1;margin-top:20px;filter:drop-shadow(0 0 30px rgba(139,124,199,.7))}
.pcard .pr small{font-size:52px;color:#C9C2E3;font-weight:800}
#okb{position:absolute;left:0;right:0;top:1180px;text-align:center;z-index:20}
#okb i{display:inline-grid;place-items:center;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#8B7CC7,#5A3B8C);font-style:normal;font-size:64px;box-shadow:0 0 40px rgba(139,124,199,.7);vertical-align:middle}
#okb b{display:inline-block;vertical-align:middle;margin-left:24px;font-size:54px;font-weight:900;text-align:left;line-height:1.1}
#okb b small{display:block;font-size:34px;color:#C9C2E3;font-weight:700}
</style></head>
<body><div id="stage"><div id="world"></div>
<div id="cap"></div><div id="vig"></div><div id="flash"></div><div id="prog"></div></div>
<script src="adkit.js"></script><script src="tk.js"></script><script src="tk2.js"></script>
<script>
const {clamp, lerp, P, eio, eo, eo4, eob, $, el, on, end, W, WE} = K;
let T = {};
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#fff"/></svg>';
const RC = 760 / 603; // recap card scale
const rc = (x, y, w, h, pad = 8) => `left:${(x * RC - pad).toFixed(1)}px;top:${(y * RC - pad).toFixed(1)}px;width:${(w * RC + 2 * pad).toFixed(1)}px;height:${(h * RC + 2 * pad).toFixed(1)}px`;
function build() {
  const w = $('#world');
  w.insertAdjacentHTML('beforeend', `
  <div class="full" id="sHook"><img class="clip" id="vAv" src="assets/clips/tapis_av/001.jpg"></div>
  <div class="full" id="sDoor"><img src="assets/door_av.jpg"><img id="dap" src="assets/door_ap.jpg" style="clip-path:inset(0 0 0 100%)">
     <div class="seam" id="dseam" style="left:100%"><i>✨</i></div>
     <div class="lab av" id="dla" style="left:50px;top:1560px">AVANT</div><div class="lab ap" id="dlp" style="right:50px;top:1560px">APRÈS</div></div>
  <div class="full" id="sMat"><img class="clip" id="vAp" src="assets/clips/tapis_ap/001.jpg">
     <div id="pip"><img class="clip" id="vPip" src="assets/clips/tapis_av/001.jpg"><div class="lab av">AVANT</div></div>
     <div class="lab ap" id="mlp" style="right:50px;top:1560px">APRÈS</div></div>
  <div class="full dark" id="sCan">
     <div class="phone" style="left:310px;top:380px"><img src="assets/sc_canape.jpg"><div class="hl" id="hlC" style="${TK2.hlStyle(36, 348, 258, 120)}"></div></div>
     <div class="hook white" id="hC" style="top:170px;font-size:84px"><span>Un canapé ? 🛋️</span></div>
     <div class="sticker" id="pC" style="left:560px;top:960px;font-size:96px"><small>Canapé 2 places</small>dès 40 €</div></div>
  <div class="full dark" id="sMt">
     <div class="phone" style="left:310px;top:380px"><img src="assets/sc_matelas.jpg"><div class="hl" id="hlM" style="${TK2.hlStyle(37, 566, 256, 122)}"></div></div>
     <div class="hook white" id="hM" style="top:170px;font-size:84px"><span>Un matelas ? 🛏️</span></div>
     <div class="sticker" id="pM" style="left:560px;top:1000px;font-size:96px"><small>Matelas enfant</small>dès 35 €</div></div>
  <div class="full dark" id="sVoi">
     <div class="pcard" id="pcV"><div class="em">🚗</div><h3>Voiture</h3><p>Extérieur · citadine</p><div class="pr"><small>dès </small><span id="nV">0</span><small> €</small></div></div>
     <div class="hook white" id="hV" style="top:300px;font-size:84px"><span>Votre voiture ? 🚗</span></div></div>
  <div class="full dark" id="sDep">
     <div class="phone" style="left:310px;top:380px"><img src="assets/sc_distance.jpg"><div class="hl" id="hlD" style="${TK2.hlStyle(39, 375, 560, 115)}"></div></div>
     <div class="hook white" id="hD" style="top:170px;font-size:84px"><span>Le déplacement ?</span></div>
     <div class="stamp" id="st" style="left:300px;top:930px;font-size:130px;color:#C9C2E3;background:rgba(90,59,140,.92);box-shadow:0 0 60px rgba(139,124,199,.6)">OFFERT</div>
     <div class="chip" id="km" style="left:330px;top:1200px">📍 jusqu'à 20 km</div></div>
  <div class="full dark" id="sTot">
     <div class="card" id="rcard" style="left:160px;top:370px;width:760px"><img src="assets/sc_recap.jpg">
        <div class="hl" id="hlT" style="${rc(40, 300, 530, 52)}"></div><div class="hl" id="hlO" style="${rc(470, 214, 100, 42)}"></div></div>
     <div class="hook white" id="hT" style="top:170px;font-size:76px"><span>Le total, avant de réserver</span></div>
     <div class="sticker" id="sur" style="left:600px;top:1040px;font-size:64px">0 surprise ✅</div>
     <div id="okb"><i>✓</i><b>Total affiché<small>pas de frais cachés</small></b></div></div>
  <div class="full" id="sEnd">
     <div class="badge" id="bd" style="left:300px;top:330px;width:480px;height:480px"><img src="assets/logo.png"></div>
     <div class="hook white" id="e1" style="top:900px;font-size:66px"><span>Réservez en 1 minute 👇</span></div>
     <div class="cta" id="e2" style="top:1060px;background:linear-gradient(95deg,#5A3B8C,#8B7CC7);box-shadow:0 0 50px rgba(139,124,199,.55)">sublimnet.com</div>
     <div class="hook dark" id="e3" style="top:1290px;font-size:44px"><span>Enregistre pour plus tard 📌</span></div></div>
  <div class="hook white" id="h1" style="top:300px;font-size:96px"><span>Combien ça coûte</span></div>
  <div class="hook violet" id="h2" style="top:450px;font-size:96px"><span>VRAIMENT ? 🤔</span></div>
  <div class="chip" id="h3" style="left:260px;top:640px">🏠 À domicile · Bordeaux</div>
  <div class="hook white" id="hR" style="top:170px;font-size:84px"><span>Le résultat ✨</span></div>`);
  T.sparks = Array.from({ length: 10 }, (_, i) => { const s = el('div', 'spark', STAR, w); return { s, x: 120 + (i * 97) % 860, y: 300 + (i * 211) % 1200, d: i * 0.13 }; });
  T.t = {
    h1: 0.1, h2: W('b1', 'combien') - 0.05, h3: W('b1', 'coûte') + 0.1, door: W('b1', 'combien') - 0.05,
    rv0: end('b1') + 0.05, rv1: end('b1') + 0.8, mat: end('b1') + 1.45,
    can: on('b2') - 0.08, dCan: W('b2', 'dès') - 0.1, mt: on('b3') - 0.08, dMat: W('b3', 'dès') - 0.1,
    voi: on('b4') - 0.08, dVoi: W('b4', 'dès') - 0.1, dep: on('b5') - 0.08, st: W('b5', 'offert') - 0.08,
    tot: on('b6') - 0.08, t2: W('b6', 'avant') - 0.1, end: on('b7') - 0.12, e1: W('b7', 'réservez') - 0.1, e2: W('b7', 'sublim') - 0.05, e3: end('b7') - 0.1,
  };
  const t = T.t;
  T.cuts = [t.door, t.mat, t.can, t.mt, t.voi, t.dep, t.tot, t.end];
  // punches only on graphic scenes (photos and clips stay whole, no zoom)
  T.punch = [{ t: t.can, z: 0.08 }, { t: t.dCan, z: 0.05, shake: 5 }, { t: t.mt, z: 0.08 }, { t: t.dMat, z: 0.05, shake: 5 }, { t: t.voi, z: 0.08 }, { t: t.dVoi + 0.45, z: 0.06, shake: 8 },
    { t: t.dep, z: 0.08 }, { t: t.st + 0.18, z: 0.12, shake: 20, dur: 0.6 }, { t: t.tot, z: 0.08 }, { t: t.t2, z: 0.05, shake: 6 }, { t: t.end, z: 0.1 }, { t: t.e2, z: 0.05, shake: 5 }];
  TK.buildCaptions(null, { replace: { quarante: '40', 'trente-cinq': '35', 'quarante-cinq': '45', vingt: '20', euros: '€', kilomètres: 'km', sublimnet: 'SublimNet' },
    merge: [[['sublim', 'net', 'point', 'com'], 'sublimnet.com']], skip: ['b7'] });
}
const vis = (tt, a, b) => tt >= a && tt < b ? 1 : 0;
function render(tt) {
  const t = T.t, D = K.VO.duration;
  // scenes
  $('#sHook').style.opacity = vis(tt, -1, t.door); $('#sDoor').style.opacity = vis(tt, t.door, t.mat); $('#sMat').style.opacity = vis(tt, t.mat, t.can);
  $('#sCan').style.opacity = vis(tt, t.can, t.mt); $('#sMt').style.opacity = vis(tt, t.mt, t.voi); $('#sVoi').style.opacity = vis(tt, t.voi, t.dep);
  $('#sDep').style.opacity = vis(tt, t.dep, t.tot); $('#sTot').style.opacity = vis(tt, t.tot, t.end); $('#sEnd').style.opacity = vis(tt, t.end, 99);
  // real clips (slow motion 0.5x from 60 fps)
  if (tt < t.door) TK2.clip($('#vAv'), 'tapis_av', 123, tt, 0);
  if (tt >= t.mat && tt < t.can) { TK2.clip($('#vAp'), 'tapis_ap', 79, tt, t.mat); TK2.clip($('#vPip'), 'tapis_av', 123, tt, t.mat - 0.4); }
  // hook texts
  const hk = 1 - P(tt, t.rv0 - 0.15, t.rv0 + 0.05);
  const h1 = $('#h1'); const a1 = TK.pop(h1, tt, t.h1, 0.45, 0.3, 2.4); h1.style.transform = `scale(${a1}) rotate(${(1 - clamp(a1)) * -6}deg)`; h1.style.opacity = (clamp(P(tt, t.h1, t.h1 + 0.08)) * hk).toFixed(3);
  const h2 = $('#h2'); const a2 = TK.pop(h2, tt, t.h2, 0.45, 0.2, 2.6); h2.style.transform = `scale(${a2}) rotate(${-3 + (1 - clamp(a2)) * 8}deg)`; h2.style.opacity = (clamp(P(tt, t.h2, t.h2 + 0.08)) * hk).toFixed(3);
  const h3 = $('#h3'); const a3 = TK.pop(h3, tt, t.h3, 0.4, 0.4); h3.style.transform = `scale(${a3})`; h3.style.opacity = (clamp(P(tt, t.h3, t.h3 + 0.08)) * hk).toFixed(3);
  // door: wipe-through reveal
  const X = 100 - 100 * eio(P(tt, t.rv0, t.rv1));
  $('#dap').style.clipPath = `inset(0 0 0 ${X.toFixed(2)}%)`; $('#dseam').style.left = X + '%'; $('#dseam').style.opacity = tt > t.rv0 - 0.05 && tt < t.rv1 + 0.1 ? 1 : 0;
  const dla = $('#dla'); dla.style.transform = `scale(${TK.pop(dla, tt, t.door + 0.15, 0.35, 0.5)})`; dla.style.opacity = (clamp(P(tt, t.door + 0.15, t.door + 0.22)) * (1 - P(tt, t.rv1 - 0.2, t.rv1))).toFixed(3);
  const dlp = $('#dlp'); dlp.style.transform = `scale(${TK.pop(dlp, tt, t.rv1 - 0.05, 0.35, 0.5)})`;
  const hR = $('#hR'); const aR = TK.pop(hR, tt, t.rv1 - 0.05, 0.4, 0.3, 2.4); hR.style.transform = `scale(${aR}) rotate(${(1 - clamp(aR)) * -6}deg)`; hR.style.opacity = (clamp(P(tt, t.rv1 - 0.05, t.rv1 + 0.03)) * vis(tt, t.rv1 - 0.05, t.can)).toFixed(3);
  T.sparks.forEach(sp => { const k = tt - t.rv1 - sp.d; const on_ = tt < t.mat && k > 0 && k < 1.0;
    sp.s.style.opacity = on_ ? Math.sin(Math.min(1, k / 1.0) * Math.PI).toFixed(3) : 0;
    sp.s.style.transform = `translate(${sp.x}px, ${sp.y}px) scale(${on_ ? 0.6 + Math.sin(k * 8) * 0.4 + 0.6 : 0}) rotate(${k * 90}deg)`; });
  const pip = $('#pip'); const pq = eob(P(tt, t.mat + 0.05, t.mat + 0.4), 1.8); pip.style.transform = `scale(${(0.6 + 0.4 * pq).toFixed(3)}) rotate(${(-3 + (1 - clamp(pq)) * -8).toFixed(2)}deg)`; pip.style.opacity = clamp(P(tt, t.mat + 0.05, t.mat + 0.12)).toFixed(3);
  const mlp = $('#mlp'); mlp.style.transform = `scale(${TK.pop(mlp, tt, t.mat + 0.1, 0.35, 0.5)})`;
  // price scenes with the real site
  [['#hC', t.can], ['#hM', t.mt], ['#hV', t.voi], ['#hD', t.dep], ['#hT', t.tot]].forEach(([s, a]) => { const e = $(s); const q = TK.pop(e, tt, a + 0.05, 0.4, 0.4); e.style.transform = `scale(${q})`; });
  document.querySelectorAll('.phone').forEach(ph => { const sc = ph.closest('.full'); const a = { sCan: t.can, sMt: t.mt, sDep: t.dep }[sc.id];
    const q = eob(P(tt, a + 0.02, a + 0.45), 1.6); ph.style.transform = `translateY(${((1 - q) * 260).toFixed(1)}px) rotate(${((1 - q) * 6 - 1.5).toFixed(2)}deg)`; });
  TK2.ring($('#hlC'), tt, t.dCan); TK2.ring($('#hlM'), tt, t.dMat); TK2.ring($('#hlD'), tt, t.st - 0.3);
  [['#pC', t.dCan + 0.05], ['#pM', t.dMat + 0.05]].forEach(([s, a], i) => { const e = $(s); const q = TK.pop(e, tt, a, 0.45, 0.3, 2.4); e.style.transform = `scale(${q}) rotate(${(i ? -4 : 4) + (1 - clamp(q)) * 10}deg)`; });
  // voiture card with rolling price
  const pc = $('#pcV'); const cq = eob(P(tt, t.voi + 0.05, t.voi + 0.5), 1.7); pc.style.transform = `translateY(${((1 - cq) * 220).toFixed(1)}px) scale(${(0.85 + 0.15 * cq).toFixed(3)})`;
  $('#nV').textContent = Math.round(45 * eo(P(tt, t.dVoi, t.dVoi + 0.45)));
  // déplacement offert
  const st = $('#st'); const sq = P(tt, t.st, t.st + 0.22); st.style.opacity = sq > 0 ? 1 : 0; st.style.transform = `rotate(-10deg) scale(${(2.6 - 1.6 * eo4(sq)).toFixed(3)})`;
  const km = $('#km'); km.style.transform = `scale(${TK.pop(km, tt, t.st + 0.45, 0.4, 0.4)})`;
  // total: real recap
  const rcd = $('#rcard'); const rq = eob(P(tt, t.tot + 0.02, t.tot + 0.45), 1.6); rcd.style.transform = `translateY(${((1 - rq) * 240).toFixed(1)}px) rotate(${((1 - rq) * 5 - 1).toFixed(2)}deg)`;
  TK2.ring($('#hlO'), tt, t.tot + 0.5); TK2.ring($('#hlT'), tt, t.t2 - 0.2);
  const ok = $('#okb'); const oq = TK.pop(ok, tt, t.t2, 0.45, 0.4); ok.style.transform = `scale(${oq})`;
  const su = $('#sur'); const uq = TK.pop(su, tt, t.t2 + 0.35, 0.4, 0.3, 2.4); su.style.transform = `scale(${uq}) rotate(${6 + (1 - clamp(uq)) * 10}deg)`;
  // end card
  const bd = $('#bd'); const bs = TK.pop(bd, tt, t.end + 0.05, 0.55, 0.2, 2.4); bd.style.transform = `scale(${bs}) rotate(${(1 - clamp(bs)) * 10}deg)`;
  bd.style.boxShadow = `0 20px 60px rgba(14,11,29,.5), 0 0 ${60 + 30 * Math.sin(tt * 3)}px rgba(139,124,199,.45)`;
  [['#e1', t.e1], ['#e2', t.e2], ['#e3', t.e3]].forEach(([s, a]) => { const e = $(s); e.style.transform = `scale(${TK.pop(e, tt, a, 0.4, 0.5)})`; });
  const c = TK.camera(tt, T.punch);
  $('#world').style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px) rotate(${c.r.toFixed(3)}deg) scale(${c.s.toFixed(4)})`;
  let fl = 0; for (const cu of T.cuts) if (tt >= cu) fl = Math.max(fl, 1 - P(tt, cu, cu + 0.16));
  $('#flash').style.opacity = (fl * 0.5).toFixed(3);
  $('#prog').style.width = (1080 * clamp(tt / D)).toFixed(1) + 'px';
  $('#cap').style.top = (tt >= t.can && tt < t.end && !(tt >= t.voi && tt < t.dep)) ? '1420px' : (tt >= t.voi && tt < t.dep ? '1300px' : '1180px');
  TK.captions(tt, x => x >= t.end || (x >= t.voi && x < t.voi));
}
window.__ready = K.boot('voB.json', build, render);
</script></body></html>
